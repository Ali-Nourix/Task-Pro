<!DOCTYPE html>

<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" name="viewport"/><meta content="light dark" name="color-scheme"/><meta content="تسک‌ها و برنامهٔ روزانه، همراه با یادداشت‌های Obsidian در تلگرام." name="description"/><title>Task Pro</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>/* STYLES */</style><meta content="#f5f8f6" name="theme-color"/></head>
<body><a class="skip" href="#tasks">Skip to tasks</a><main aria-busy="true" aria-label="برنامهٔ تسک‌ها" id="app">
<header class="top"><div><h1 id="heading">برنامهٔ روز</h1><p class="muted" id="date"></p></div><button aria-label="تسک جدید" class="add-button" id="add"><svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><path d="M12 5v14M5 12h14"></path></svg><span id="add-label">افزودن تسک</span></button><button aria-label="به‌روزرسانی فهرست" class="icon" id="refresh"><svg aria-hidden="true" fill="none" height="20" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" width="20"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M6.2 7a7 7 0 0 1 11.5-1L20 9M4 15l2.3 3A7 7 0 0 0 17.8 17"></path></svg></button></header>
<div class="notice" hidden="" id="notice" role="status"></div>
<section aria-label="Task overview" class="day-overview" hidden="" id="day-overview"><div class="overview-title"><span id="overview-label"></span><span id="overview-progress"></span></div><div class="overview-metrics"><button id="overview-today"><strong></strong><span></span></button><button id="overview-open"><strong></strong><span></span></button><button id="overview-done"><strong></strong><span></span></button></div><div aria-hidden="true" class="completion-track"><span id="completion-fill"></span></div></section><button class="overdue-callout" hidden="" id="overdue-callout"></button>
<section aria-label="Week" class="week-panel" hidden="" id="week-panel"><div class="week-caption"><span id="week-label"></span><div class="week-controls"><button aria-label="Previous week" id="prev-week">‹</button><button id="this-week">امروز</button><button aria-label="Next week" id="next-week">›</button></div></div><div hidden="" id="calendar-options"><div class="calendar-toolbar"><details id="calendar-filter"><summary id="calendar-filter-summary"><svg aria-hidden="true" fill="none" height="18" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="M4 7h16M7 12h10M10 17h4"></path></svg><span id="calendar-filter-label"></span><span aria-hidden="true" class="filter-chevron"></span></summary><div class="calendar-filter-panel"><div id="calendar-statuses"></div><div class="filter-actions"><button id="calendar-all" type="button"></button><button id="calendar-none" type="button"></button></div></div></details><button aria-pressed="false" id="calendar-undated" type="button"></button></div><p class="calendar-hint sr-only" id="calendar-hint"></p></div><div class="week-strip" id="week-strip"></div><div class="calendar-legend" hidden="" id="calendar-legend"></div></section>
<section class="task-section"><div class="section-head"><h2 id="tasks-label">کارهای من</h2><span class="task-tally"><span id="total">—</span> <span id="total-label">کار باز</span></span><button class="day-add" hidden="" id="day-add" type="button"></button></div>
<div class="list-tools"><nav aria-label="فیلتر تسک‌ها" class="tabs" id="filters"><button aria-pressed="true" data-filter="today">امروز <span id="today-count"></span></button><button aria-pressed="false" data-filter="all">همه</button><button aria-pressed="false" data-filter="late">عقب‌افتاده <span id="late-count"></span></button></nav><span hidden="" id="today-label"></span><span hidden="" id="late-label"></span></div>
<label class="search"><span aria-hidden="true"><svg fill="none" height="20" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" width="20"><circle cx="10" cy="10" r="6.5"></circle><path d="m15 15 5 5"></path></svg></span><input aria-label="جست‌وجوی تسک‌ها" id="search" placeholder="جست‌وجوی تسک‌ها…" type="search"/></label>
<section aria-live="polite" id="tasks"></section><button class="inline-create" id="inline-add" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span></span></button></section>
<section class="upcoming" hidden="" id="upcoming"><div class="section-head"><h2 id="upcoming-label">برنامهٔ بعدی</h2><button class="text-button" id="view-plan">دیدن برنامه</button></div><button class="event-card" id="next-task"></button></section>
<section hidden="" id="chat-panel"><div class="section-head"><h2 id="chat-title"></h2><button class="text-button" id="chat-clear"></button></div><p class="help" id="chat-hint"></p><div class="chat-prompts" id="chat-prompts"></div><div aria-busy="false" aria-live="polite" id="chat-messages" role="log"></div><div class="notice" hidden="" id="chat-error" role="alert"></div><form class="chat-composer" id="chat-form"><label class="composer-label" for="chat-input">پیام به دستیار</label><textarea dir="auto" id="chat-input" maxlength="2000" required="" rows="1"></textarea><button class="primary" id="chat-send" type="submit"></button></form><p class="help" id="chat-privacy"></p></section><footer><span class="muted" id="sync"></span><button class="text-button" id="bot">بازگشت به ربات</button></footer>
</main><div class="dock"><div class="rail-brand"><svg class="nav-mark" aria-hidden="true" viewBox="0 0 28 28" fill="none"><path d="M4 14l5 5L20 7M12 21l12-13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>TaskPro</b></div><nav aria-label="Navigation" class="bottom-nav" id="bottom-nav"><button aria-pressed="true" data-mode="home"><svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><path d="m3 11 9-8 9 8v10H3z"></path><path d="M9 21v-7h6v7"></path></svg><span>خانه</span></button><button aria-pressed="false" data-mode="tasks"><svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><rect height="18" rx="4" width="18" x="3" y="3"></rect><path d="m7 9 1 1 2-2m3 1h4M7 15h3m3 0h4"></path></svg><span>تسک‌ها</span></button><button aria-pressed="false" data-mode="calendar"><svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><rect height="16" rx="4" width="18" x="3" y="5"></rect><path d="M7 3v4m10-4v4M3 11h18M8 15h1m6 0h1"></path></svg><span>تقویم</span></button><button aria-pressed="false" data-mode="ai"><svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><path d="M20 15a4 4 0 0 1-4 4H9l-6 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4z"></path><path d="M7 8h9M7 12h6"></path></svg><span>دستیار</span></button></nav><p class="rail-note" id="rail-note"></p></div>
<dialog aria-labelledby="sheet-title" id="sheet"><div class="sheet-head"><h2 id="sheet-title"></h2><button aria-label="بستن" class="icon" id="close">×</button></div><div id="sheet-body"></div></dialog>
<div hidden="" id="progress" role="status"></div><div hidden="" id="toast" role="status"></div><script type="module">/* APP */</script></body></html>
