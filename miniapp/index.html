<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="description" content="Your TaskPro tasks and daily plan, inside Telegram."><title>Task Pro</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="app.css"></head>
<body><a class="skip" href="#tasks">Skip to tasks</a><main id="app" aria-busy="true">
<header class="top"><div><p id="date" class="muted"></p><h1 id="heading">برنامهٔ من</h1></div><button id="refresh" class="icon" aria-label="تازه‌سازی"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.2 7a7 7 0 0 1 11.5-1L20 9M4 15l2.3 3A7 7 0 0 0 17.8 17"/></svg></button></header>
<div id="notice" class="notice" role="status" hidden></div>
<section id="week-panel" class="week-panel" hidden aria-label="Week"><div class="week-caption"><span id="week-label"></span><div class="week-controls"><button id="prev-week" aria-label="Previous week">‹</button><button id="this-week">امروز</button><button id="next-week" aria-label="Next week">›</button></div></div><div id="calendar-options" hidden><div class="calendar-toolbar"><details id="calendar-filter"><summary id="calendar-filter-summary"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span id="calendar-filter-label"></span><span class="filter-chevron" aria-hidden="true"></span></summary><div class="calendar-filter-panel"><div id="calendar-statuses"></div><div class="filter-actions"><button id="calendar-all" type="button"></button><button id="calendar-none" type="button"></button></div></div></details><button id="calendar-undated" type="button" aria-pressed="false"></button></div><p id="calendar-hint" class="calendar-hint"></p></div><div id="week-strip" class="week-strip"></div></section>
<section id="upcoming" class="upcoming" hidden><div class="section-head"><h2 id="upcoming-label">برنامهٔ بعدی</h2><button id="view-plan" class="text-button">دیدن برنامه</button></div><button id="next-task" class="event-card"></button></section>
<section class="task-section"><div class="section-head"><h2 id="tasks-label">کارهای من</h2><span class="task-tally"><span id="total">—</span> <span id="total-label">کار باز</span></span></div>
<div class="list-tools"><nav id="filters" class="tabs" aria-label="فیلتر تسک‌ها"><button data-filter="today" aria-pressed="true">امروز <span id="today-count"></span></button><button data-filter="all" aria-pressed="false">همه</button><button data-filter="late" aria-pressed="false">عقب‌افتاده <span id="late-count"></span></button></nav><span id="today-label" hidden></span><span id="late-label" hidden></span></div>
<label class="search"><span aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg></span><input id="search" type="search" placeholder="جست‌وجوی تسک‌ها…" aria-label="جست‌وجوی تسک‌ها"></label>
<section id="tasks" aria-live="polite"></section></section>
<section id="chat-panel" hidden><div class="section-head"><h2 id="chat-title"></h2><button id="chat-clear" class="text-button"></button></div><p id="chat-hint" class="help"></p><div id="chat-messages" role="log" aria-live="polite" aria-busy="false"></div><div id="chat-error" class="notice" role="alert" hidden></div><form id="chat-form" class="chat-composer"><label class="sr-only" for="chat-input">Message</label><textarea id="chat-input" rows="2" maxlength="2000" required dir="auto"></textarea><button id="chat-send" type="submit" class="primary"></button></form><p id="chat-privacy" class="help"></p></section><footer><span id="sync" class="muted"></span><button id="bot" class="text-button">بازگشت به ربات</button></footer>
</main><div class="dock"><nav id="bottom-nav" class="bottom-nav" aria-label="Navigation"><button data-mode="home" aria-pressed="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/></svg><span>خانه</span></button><button data-mode="tasks" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m7 9 1 1 2-2m3 1h4M7 15h3m3 0h4"/></svg><span>تسک‌ها</span></button><button data-mode="calendar" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 11h18M8 15h1m6 0h1"/></svg><span>تقویم</span></button><button data-mode="ai" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a4 4 0 0 1-4 4H9l-6 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4z"/><path d="M7 8h9M7 12h6"/></svg><span>دستیار</span></button></nav><button id="add" class="add-button" aria-label="تسک جدید"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<dialog id="sheet"><div class="sheet-head"><h2 id="sheet-title"></h2><button id="close" class="icon" aria-label="بستن">×</button></div><div id="sheet-body"></div></dialog>
<div id="progress" role="status" hidden></div><div id="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
